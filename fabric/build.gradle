plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
    id 'com.modrinth.minotaur' version '2.+'
}

repositories {
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
//    mappings loom.layered() {
//        officialMojangMappings()
//        parchment("org.parchmentmc.data:parchment-${parchment_mc}:${parchment_version}@zip")
//    }
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
//    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"
    compileOnly "mezz.jei:jei-26.1.2-common:${jei_version}"
//    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
//
//    compileOnly "curse.maven:quickbench-914551:5075002"

    api "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    api "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    api "org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cca_version}"

    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-block:${project.cca_version}"
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

