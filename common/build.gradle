plugins {
    id 'multiloader-common'
    id 'org.spongepowered.gradle.vanilla' version '0.3.2-SNAPSHOT'
}

minecraft {
    version(minecraft_version)
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWideners(aw)
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'

//    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"
    compileOnly "mezz.jei:jei-26.1.2-common:${jei_version}"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
